<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mollie Starnes Portfolio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#f4f7f6;--ink:#102a31;--muted:#4f656b;--line:#d5e0de;--accent:#17716d;--err:#a8322d}
@media (prefers-color-scheme:dark){:root{--bg:#0c1b1f;--ink:#e8f0ee;--muted:#9db2b5;--line:#24404a;--accent:#5cc2ba;--err:#ef8a84;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,sans-serif;padding:24px 16px}
main{width:100%;max-width:380px}
h1{font-family:"Gloock",Georgia,serif;font-weight:400;font-size:40px;line-height:1.05;margin:0}
p{color:var(--muted);margin:12px 0 28px;line-height:1.5}
label{display:block;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
input{width:100%;padding:13px 14px;font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:8px;background:transparent;color:var(--ink)}
input:focus{outline:none;border-color:var(--accent)}
button{margin-top:14px;width:100%;padding:13px;font:inherit;font-weight:600;font-size:16px;border:0;border-radius:999px;background:var(--accent);color:var(--bg);cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.err{color:var(--err);font-size:14px;min-height:20px;margin-top:10px}
</style>
</head>
<body>
<main>
<h1>Mollie Starnes</h1>
<p>Marketing leader. This portfolio is private. Enter the password you were given to view it.</p>
<form id="f">
<label for="pw">Password</label>
<input id="pw" type="password" autocomplete="current-password" autofocus required>
<button type="submit">View portfolio</button>
<div class="err" id="err" role="alert"></div>
</form>
</main>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.i)},key,b(P.d)));
  try{sessionStorage.setItem('pf',pw)}catch(e){}
  document.open();document.write(html);document.close();
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();const err=document.getElementById('err');err.textContent='Checking…';
  try{await open_(document.getElementById('pw').value)}catch(x){err.textContent='That password didn\'t work. Check it and try again.'}
});
try{const s=sessionStorage.getItem('pf');if(s)open_(s).catch(()=>{})}catch(e){}
